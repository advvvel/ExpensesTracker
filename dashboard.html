<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STASH. - Authenticate</title>
    <style>
        :root {
            --bg-neutral: #f4f4f2;
            --card-white: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #757575;
            --border-light: #e0e0dc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-neutral);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-white);
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            box-sizing: border-box;
        }

        h1 { font-size: 2rem; margin: 0 0 5px 0; letter-spacing: 1px; text-align: center; font-weight: 700; }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin: 0 0 35px 0; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; }
        .form-group input { 
            width: 100%; padding: 12px 14px; border: 1px solid var(--border-light); 
            border-radius: 8px; font-family: inherit; box-sizing: border-box; font-size: 0.95rem;
            background: #fafaf9;
        }
        .form-group input:focus { outline: none; border-color: var(--text-main); background: #fff; }

        .remember-me-container { display: flex; align-items: center; gap: 8px; margin-bottom: 25px; font-size: 0.9rem; }
        .remember-me-container input { cursor: pointer; width: 16px; height: 16px; margin: 0; }
        
        .btn-black { 
            width: 100%; background: #1a1a1a; color: white; border: none; 
            padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn-black:hover { opacity: 0.9; }

        .toggle-link { text-align: center; margin-top: 25px; font-size: 0.85rem; color: var(--text-muted); }
        .toggle-link span { color: #1a1a1a; text-decoration: underline; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="auth-card">
    <h1>STASH.</h1>
    <p class="subtitle" id="auth-subtitle">Sign in to manage your available funds</p>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="remember-me-container" id="remember-wrapper">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe" style="cursor:pointer; font-weight: 500;">Remember Me</label>
    </div>

    <button class="btn-black" id="mainBtn" onclick="window.handleAuth()">Sign In</button>

    <div class="toggle-link" id="toggleModeMsg">
        Don't have an account? <span onclick="window.toggleAuthMode()">Create an account</span>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        setPersistence, 
        browserLocalPersistence, 
        browserSessionPersistence,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // Fixed config matching your console setup perfectly
    const firebaseConfig = {
        apiKey: "AIzaSyDPz1BPnN7Xan09WgdA6UVKk9gjU0DGIks",
        authDomain: "stash-tracke.firebaseapp.com",
        projectId: "stash-tracke",
        storageBucket: "stash-tracke.firebasestorage.app",
        messagingSenderId: "187196565090",
        appId: "1:187196565090:web:347de41a82978f17d5933b",
        measurementId: "G-DPLQWMGNLC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = 'index.html';
        }
    });

    window.toggleAuthMode = () => {
        const mainBtn = document.getElementById('mainBtn');
        const subtitle = document.getElementById('auth-subtitle');
        const toggleMsg = document.getElementById('toggleModeMsg');
        const rememberWrapper = document.getElementById('remember-wrapper');

        if (mainBtn.innerText === "Sign In") {
            mainBtn.innerText = "Sign Up";
            subtitle.innerText = "Create your secure profile credentials";
            rememberWrapper.style.display = "none";
            toggleMsg.innerHTML = `Already have an account? <span onclick="window.toggleAuthMode()">Sign In</span>`;
        } else {
            mainBtn.innerText = "Sign In";
            subtitle.innerText = "Sign in to manage your available funds";
            rememberWrapper.style.display = "flex";
            toggleMsg.innerHTML = `Don't have an account? <span onclick="window.toggleAuthMode()">Create an account</span>`;
        }
    };

    window.handleAuth = async () => {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        const remember = document.getElementById('rememberMe').checked;
        const isSignUp = document.getElementById('mainBtn').innerText === "Sign Up";

        if (!email || !pass) {
            alert("Please fill in all input fields.");
            return;
        }

        try {
            if (!isSignUp) {
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                await signInWithEmailAndPassword(auth, email, pass);
            } else {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("Account created successfully!");
            }
            window.location.href = 'index.html';
        } catch (err) {
            alert("Authentication Error: " + err.message);
        }
    };
</script>
</body>
</html>
