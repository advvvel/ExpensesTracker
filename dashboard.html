<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STASH. - Authenticate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body-layout">

<div class="auth-card">
    <h1>STASH.</h1>
    <p class="subtitle" id="auth-subtitle">Sign in to manage your available funds</p>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="remember-me-container" id="remember-wrapper">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe" style="cursor:pointer; font-weight: 500;">Remember Me</label>
    </div>

    <button class="btn-black" id="mainBtn" onclick="window.handleAuth()">Sign In</button>

    <div class="toggle-link" id="toggleModeMsg">
        Don't have an account? <span onclick="window.toggleAuthMode()">Create an account</span>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        setPersistence, 
        browserLocalPersistence, 
        browserSessionPersistence,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPz1BPnN7Xan09WgdA6UVKk9gjU0DGiKs",
        authDomain: "stash-tracke.firebaseapp.com",
        projectId: "stash-tracke",
        storageBucket: "stash-tracke.firebasestorage.app",
        messagingSenderId: "187196565090",
        appId: "1:187196565090:web:347de41a82978f17d5933b",
        measurementId: "G-DPLQWMGNLC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = 'index.html';
        }
    });

    window.toggleAuthMode = () => {
        const mainBtn = document.getElementById('mainBtn');
        const subtitle = document.getElementById('auth-subtitle');
        const toggleMsg = document.getElementById('toggleModeMsg');
        const rememberWrapper = document.getElementById('remember-wrapper');

        if (mainBtn.innerText === "Sign In") {
            mainBtn.innerText = "Sign Up";
            subtitle.innerText = "Create your secure profile credentials";
            rememberWrapper.style.display = "none";
            toggleMsg.innerHTML = `Already have an account? <span onclick="window.toggleAuthMode()">Sign In</span>`;
        } else {
            mainBtn.innerText = "Sign In";
            subtitle.innerText = "Sign in to manage your available funds";
            rememberWrapper.style.display = "flex";
            toggleMsg.innerHTML = `Don't have an account? <span onclick="window.toggleAuthMode()">Create an account</span>`;
        }
    };

    window.handleAuth = async () => {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        const remember = document.getElementById('rememberMe').checked;
        const isSignUp = document.getElementById('mainBtn').innerText === "Sign Up";

        if (!email || !pass) {
            alert("Please fill in all input fields.");
            return;
        }

        try {
            if (!isSignUp) {
                await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
                await signInWithEmailAndPassword(auth, email, pass);
            } else {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("Account created successfully!");
            }
            window.location.href = 'index.html';
        } catch (err) {
            alert("Authentication Error: " + err.message);
        }
    };
</script>
</body>
</html>
