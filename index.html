<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash Expense Tracker</title>
    <style>
        :root {
            --bg-neutral: #f4f4f2;
            --card-white: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #757575;
            --accent-green: #8da38a;
            --border-light: #e0e0dc;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-neutral);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-white);
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        header { margin-bottom: 40px; }
        header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin: 0; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 200px 1fr 300px;
            gap: 40px;
            align-items: start;
        }

        /* SIDEBAR */
        .nav-links { list-style: none; padding: 0; margin: 0; }
        .nav-links li {
            padding: 12px 0;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links li:hover { color: var(--text-main); }
        .nav-links li.active { color: var(--text-main); border-left: 3px solid var(--text-main); padding-left: 15px; }

        /* CENTER AREA */
        .center-column { display: flex; flex-direction: column; align-items: center; }

        .circle-container { position: relative; width: 260px; height: 260px; margin-bottom: 40px; }
        .circle-svg { transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: var(--border-light); stroke-width: 12; }
        .circle-progress {
            fill: none; stroke: var(--text-main); stroke-width: 12; 
            stroke-linecap: round; transition: stroke-dashoffset 0.5s ease;
        }
        .circle-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;
        }
        .circle-text span { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; }
        .circle-text h2 { margin: 5px 0 0; font-size: 2.2rem; font-weight: 300; }

        /* TABS CONTROL */
        .tab-view { display: none; width: 100%; }
        .tab-view.active { display: block; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 20px; }
        th { text-align: left; background: #ededeb; padding: 12px 15px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }
        td { padding: 15px; border-bottom: 1px solid var(--border-light); }

        .btn-black {
            background: var(--text-main); color: white; border: none; padding: 10px 20px; 
            border-radius: 8px; font-weight: 600; cursor: pointer;
        }

        .input-group {
            display: flex; gap: 10px; margin-top: 20px; background: #f9f9f7; padding: 20px; border-radius: 12px;
        }
        input { padding: 12px; border: 1px solid var(--border-light); border-radius: 8px; font-family: inherit; }

        /* SAVINGS CARD */
        .savings-card { background: #ededeb; padding: 25px; border-radius: 16px; }
        .savings-header { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; display: block; }
        .savings-bar-bg { background: var(--card-white); height: 12px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .savings-bar-fill { background: var(--text-main); height: 100%; width: 0%; transition: width 0.5s ease; }
        .savings-stats div { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }

        .action-link { color: #cc0000; cursor: pointer; font-size: 0.8rem; text-decoration: underline; margin-right: 10px; }
        .edit-link { color: #0055cc; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Stash Expense Tracker.</h1></header>

    <div class="dashboard-layout">
        <aside>
            <ul class="nav-links">
                <li class="active" onclick="showTab('overview', this)">🏠 Overview</li>
                <li onclick="showTab('income', this)">💵 Income</li>
                <li onclick="showTab('savings', this)">🏦 Savings</li>
                <li onclick="showTab('reports', this)">📊 Reports</li>
            </ul>
        </aside>

        <main class="center-column">
            <div class="circle-container">
                <svg class="circle-svg" width="260" height="260">
                    <circle class="circle-bg" cx="130" cy="130" r="120"></circle>
                    <circle id="progress-bar" class="circle-progress" cx="130" cy="130" r="120" stroke-dasharray="754" stroke-dashoffset="0"></circle>
                </svg>
                <div class="circle-text">
                    <span>Total Available Funds</span>
                    <h2 id="total-display">$0.00</h2>
                </div>
            </div>

            <div id="overview" class="tab-view active">
                <table>
                    <thead><tr><th>Type</th><th>Category</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead>
                    <tbody id="expense-list"></tbody>
                </table>
                <div class="input-group">
                    <input type="text" id="exp-name" placeholder="Name (e.g. Rent)" style="flex: 2;">
                    <input type="number" id="exp-amount" placeholder="$ Amount" style="flex: 1;">
                    <button class="btn-black" onclick="addExpense()">Add</button>
                </div>
            </div>

            <div id="income" class="tab-view">
                <h3>Deposit Income</h3>
                <div class="input-group">
                    <input type="number" id="deposit-amt" placeholder="Enter amount..." style="flex: 1;">
                    <button class="btn-black" onclick="depositMoney()">Deposit</button>
                </div>
            </div>

            <div id="reports" class="tab-view">
                <h3>Modification History</h3>
                <table>
                    <thead><tr><th>Change</th><th>Prev Value</th><th>New Value</th><th>Date</th><th>Action</th></tr></thead>
                    <tbody id="report-list"></tbody>
                </table>
            </div>
        </main>

        <aside class="savings-card">
            <span class="savings-header">Savings Snapshot</span>
            <div class="savings-stats">
                <div><span>Savings Goal</span> <strong id="goal-val">$0.00</strong></div>
                <div class="savings-bar-bg"><div id="savings-fill" class="savings-bar-fill"></div></div>
                <div><span>Currently Saved</span> <strong id="saved-val">$0.00</strong></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <button class="btn-black" style="background: white; color: black; border: 1px solid #ccc;" onclick="modifyGoal()">Modify Goal</button>
                <button class="btn-black" onclick="transferToSavings()">Add to Savings</button>
            </div>
        </aside>
    </div>
</div>

<script>
    let state = {
        total: 1000,
        goal: 5000,
        saved: 3500,
        expenses: [
            { id: Date.now(), name: "Rent", cat: "Fixed", amt: 800, date: "May 1" },
            { id: Date.now()+1, name: "Groceries", cat: "Variable", amt: 150, date: "May 3" }
        ],
        logs: []
    };

    function showTab(id, el) {
        document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function logChange(desc, oldV, newV) {
        state.logs.unshift({
            id: Date.now(),
            desc: desc,
            old: oldV,
            new: newV,
            date: new Date().toLocaleTimeString()
        });
        updateUI();
    }

    function updateUI() {
        // Update Circle & Text
        document.getElementById('total-display').innerText = `$${state.total.toLocaleString()}`;
        const circ = 754;
        let p = Math.max(0, Math.min(1, state.total / 2000)); // Normalized to $2k for visual
        document.getElementById('progress-bar').style.strokeDashoffset = circ - (p * circ);

        // Update Savings
        document.getElementById('goal-val').innerText = `$${state.goal.toLocaleString()}`;
        document.getElementById('saved-val').innerText = `$${state.saved.toLocaleString()}`;
        let savePerc = (state.saved / state.goal) * 100;
        document.getElementById('savings-fill').style.width = Math.min(100, savePerc) + "%";

        // Render Expenses
        const expBody = document.getElementById('expense-list');
        expBody.innerHTML = state.expenses.map(e => `
            <tr><td>${e.name}</td><td>${e.cat}</td><td>$${e.amt}</td><td>${e.date}</td>
            <td><span class="action-link" onclick="deleteExpense(${e.id})">Delete</span></td></tr>
        `).join('');

        // Render Reports (Audit Log)
        const reportBody = document.getElementById('report-list');
        reportBody.innerHTML = state.logs.map(l => `
            <tr><td>${l.desc}</td><td>$${l.old}</td><td>$${l.new}</td><td>${l.date}</td>
            <td>
                <span class="action-link edit-link" onclick="editLog(${l.id})">Edit</span>
                <span class="action-link" onclick="deleteLog(${l.id})">Delete</span>
            </td></tr>
        `).join('');
    }

    function addExpense() {
        const n = document.getElementById('exp-name').value;
        const a = parseFloat(document.getElementById('exp-amount').value);
        if (n && a) {
            let oldTotal = state.total;
            state.total -= a;
            state.expenses.push({ id: Date.now(), name: n, cat: "Variable", amt: a, date: "Today" });
            logChange(`Added Expense: ${n}`, oldTotal, state.total);
            document.getElementById('exp-name').value = '';
            document.getElementById('exp-amount').value = '';
        }
    }

    function deleteExpense(id) {
        const e = state.expenses.find(x => x.id === id);
        let oldTotal = state.total;
        state.total += e.amt;
        state.expenses = state.expenses.filter(x => x.id !== id);
        logChange(`Deleted Expense: ${e.name}`, oldTotal, state.total);
    }

    function depositMoney() {
        const a = parseFloat(document.getElementById('deposit-amt').value);
        if (a) {
            let old = state.total;
            state.total += a;
            logChange("Manual Deposit", old, state.total);
            document.getElementById('deposit-amt').value = '';
        }
    }

    function modifyGoal() {
        const g = parseFloat(prompt("Enter new Savings Goal:", state.goal));
        if (g) {
            let old = state.goal;
            state.goal = g;
            logChange("Goal Modified", old, state.goal);
        }
    }

    function transferToSavings() {
        const a = parseFloat(prompt("Move how much from Available to Savings?"));
        if (a && a <= state.total) {
            let oldS = state.saved;
            let oldT = state.total;
            state.total -= a;
            state.saved += a;
            logChange("Transferred to Savings", oldS, state.saved);
        }
    }

    function deleteLog(id) {
        state.logs = state.logs.filter(l => l.id !== id);
        updateUI();
    }

    function editLog(id) {
        const l = state.logs.find(x => x.id === id);
        const newDesc = prompt("Edit Description:", l.desc);
        const newVal = parseFloat(prompt("Edit New Value:", l.new));
        if (newDesc) l.desc = newDesc;
        if (!isNaN(newVal)) l.new = newVal;
        updateUI();
    }

    updateUI();
</script>
</body>
</html>
