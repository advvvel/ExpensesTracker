<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash Expense Tracker</title>
    <style>
        :root {
            --bg-neutral: #f4f4f2;
            --card-white: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #757575;
            --border-light: #e0e0dc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-neutral);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--card-white);
            border-radius: 24px;
            padding: 50px;
            min-height: 80vh;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 220px 1fr 320px;
            gap: 40px;
        }

        /* SIDEBAR NAVIGATION */
        .nav-links { list-style: none; padding: 0; margin: 0; }
        .nav-links li {
            padding: 15px 20px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links li:hover { background: #f0f0ee; color: var(--text-main); }
        .nav-links li.active { 
            color: var(--text-main); 
            background: #f0f0ee;
            border-left: 4px solid var(--text-main); 
        }

        /* PAGE CONTENT CONTROL */
        .page-content { display: none; }
        .page-content.active { display: block; }

        /* CENTER VISUALS */
        .circle-container { 
            display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; 
        }
        .main-circle {
            width: 280px; height: 280px;
            border: 12px solid var(--text-main);
            border-radius: 50%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            margin-bottom: 30px;
        }
        .main-circle span { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: var(--text-muted); }
        .main-circle h2 { font-size: 2.5rem; margin: 5px 0; font-weight: 400; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #ededeb; padding: 12px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
        td { padding: 15px; border-bottom: 1px solid var(--border-light); font-size: 0.9rem; }

        /* BUTTONS & INPUTS */
        .add-section { background: #f9f9f7; padding: 25px; border-radius: 15px; margin-top: 30px; }
        .btn-black { background: #1a1a1a; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        input { padding: 12px; border: 1px solid var(--border-light); border-radius: 8px; margin-right: 10px; font-family: inherit; }

        /* SAVINGS CARD */
        .savings-card { background: #ededeb; padding: 30px; border-radius: 20px; align-self: start; }
        .savings-bar { background: white; height: 12px; border-radius: 10px; margin: 15px 0; position: relative; overflow: hidden; }
        #savings-progress { background: #1a1a1a; height: 100%; width: 0%; transition: 0.3s; }
        
        .action-btn { color: #cc0000; text-decoration: underline; cursor: pointer; font-size: 0.8rem; border: none; background: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-layout">
        
        <aside>
            <h1 style="font-size: 1.2rem; margin-bottom: 40px; letter-spacing: 1px;">STASH.</h1>
            <ul class="nav-links">
                <li id="nav-overview" class="active" onclick="navigateTo('overview')">🏠 Overview</li>
                <li id="nav-income" onclick="navigateTo('income')">💵 Income</li>
                <li id="nav-savings" onclick="navigateTo('savings')">🏦 Savings</li>
                <li id="nav-reports" onclick="navigateTo('reports')">📊 Reports</li>
            </ul>
        </aside>

        <main>
            <div class="circle-container">
                <div class="main-circle">
                    <span>Total Available Funds</span>
                    <h2 id="display-total">$0.00</h2>
                </div>
            </div>

            <div id="page-overview" class="page-content active">
                <table>
                    <thead><tr><th>Type</th><th>Category</th><th>Amount</th><th>Date</th><th>Management</th></tr></thead>
                    <tbody id="expense-table-body"></tbody>
                </table>
                <div class="add-section">
                    <input type="text" id="new-name" placeholder="Name (e.g. School)">
                    <input type="number" id="new-amount" placeholder="$ Amount">
                    <button class="btn-black" onclick="addItem()">Add</button>
                </div>
            </div>

            <div id="page-income" class="page-content">
                <h3>Deposit Money</h3>
                <input type="number" id="deposit-amt" placeholder="1000">
                <button class="btn-black" onclick="depositFunds()">Add to Funds</button>
            </div>

            <div id="page-savings" class="page-content">
                <h3>Savings Settings</h3>
                <label>Change Goal:</label><br><br>
                <input type="number" id="new-goal-input" placeholder="10000">
                <button class="btn-black" onclick="updateGoalValue()">Update Goal</button>
            </div>

            <div id="page-reports" class="page-content">
                <h3 style="text-transform: uppercase; font-size: 0.8rem; color: var(--text-muted);">Modification History</h3>
                <table>
                    <thead><tr><th>Action</th><th>Amount</th><th>Date</th><th>Management</th></tr></thead>
                    <tbody id="report-log-body"></tbody>
                </table>
            </div>
        </main>

        <aside class="savings-card">
            <span style="font-weight: 800; font-size: 0.7rem; text-transform: uppercase;">Savings Snapshot</span>
            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <span>Goal</span><strong id="goal-text">$5,000</strong>
            </div>
            <div class="savings-bar"><div id="savings-progress"></div></div>
            <div style="display: flex; justify-content: space-between;">
                <span>Saved</span><strong id="saved-text">$0</strong>
            </div>
            <button class="btn-black" style="width: 100%; margin-top: 20px; background: white; color: black; border: 1px solid #ccc;" onclick="navigateTo('savings')">Modify Savings</button>
            <button class="btn-black" style="width: 100%; margin-top: 10px;" onclick="addFundsToSavings()">Add to Savings</button>
        </aside>

    </div>
</div>

<script>
    let state = {
        total: -9500,
        saved: 13500,
        goal: 5000,
        history: []
    };

    function navigateTo(pageId) {
        document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
        document.getElementById('nav-' + pageId).classList.add('active');
        document.querySelectorAll('.page-content').forEach(page => page.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
    }

    // FIX 1: Add Item creates a row in the Overview table
    function addItem() {
        const name = document.getElementById('new-name').value;
        const amt = parseFloat(document.getElementById('new-amount').value);
        if(name && !isNaN(amt)) {
            state.total -= amt;
            const entry = { id: Date.now(), type: 'Expense', name: name, amount: amt, date: new Date().toLocaleDateString() };
            state.history.unshift(entry);
            updateAllUI();
            document.getElementById('new-name').value = '';
            document.getElementById('new-amount').value = '';
        }
    }

    // FIX 2: Income page properly adds money to total
    function depositFunds() {
        const amt = parseFloat(document.getElementById('deposit-amt').value);
        if(!isNaN(amt)) {
            state.total += amt;
            state.history.unshift({ id: Date.now(), type: 'Deposit', name: 'Income Deposit', amount: amt, date: new Date().toLocaleDateString() });
            updateAllUI();
            document.getElementById('deposit-amt').value = '';
        }
    }

    // FIX 3: Add to savings button properly moves money and updates right square
    function addFundsToSavings() {
        const amt = parseFloat(prompt("Enter amount to transfer to savings:"));
        if(!isNaN(amt)) {
            state.total -= amt;
            state.saved += amt;
            state.history.unshift({ id: Date.now(), type: 'SavingsTransfer', name: 'Transfer to Savings', amount: amt, date: new Date().toLocaleString() });
            updateAllUI();
        }
    }

    function updateGoalValue() {
        const newGoal = parseFloat(document.getElementById('new-goal-input').value);
        if(!isNaN(newGoal)) {
            state.goal = newGoal;
            updateAllUI();
            document.getElementById('new-goal-input').value = '';
        }
    }

    // FIX 4: Deleting an action reverses the math
    function deleteAction(id) {
        const item = state.history.find(h => h.id === id);
        if(item) {
            if(item.type === 'Expense') state.total += item.amount;
            if(item.type === 'Deposit') state.total -= item.amount;
            if(item.type === 'SavingsTransfer') {
                state.total += item.amount;
                state.saved -= item.amount;
            }
            state.history = state.history.filter(h => h.id !== id);
            updateAllUI();
        }
    }

    function updateAllUI() {
        // Main Circle
        document.getElementById('display-total').innerText = "$" + state.total.toLocaleString();
        
        // Right Savings Square
        document.getElementById('goal-text').innerText = "$" + state.goal.toLocaleString();
        document.getElementById('saved-text').innerText = "$" + state.saved.toLocaleString();
        const progress = (state.saved / state.goal) * 100;
        document.getElementById('savings-progress').style.width = Math.min(progress, 100) + "%";

        // Overview Table Rows
        const expenseTable = document.getElementById('expense-table-body');
        expenseTable.innerHTML = state.history.filter(h => h.type === 'Expense').map(h => `
            <tr>
                <td>${h.name}</td>
                <td>Variable</td>
                <td>$${h.amount.toLocaleString()}</td>
                <td>${h.date}</td>
                <td><button class="action-btn" onclick="deleteAction(${h.id})">Delete</button></td>
            </tr>
        `).join('');

        // Reports Table Rows
        const reportTable = document.getElementById('report-log-body');
        reportTable.innerHTML = state.history.map(h => `
            <tr>
                <td>${h.name}</td>
                <td>$${h.amount.toLocaleString()}</td>
                <td>${h.date}</td>
                <td><button class="action-btn" onclick="deleteAction(${h.id})">Delete</button></td>
            </tr>
        `).join('');
    }

    updateAllUI();
</script>
</body>
</html>
